name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test, publish
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: windows/**/*.csproj

      # .slnx baru dikenali SDK 9+, jadi CI memakai csproj langsung supaya
      # tetap jalan di SDK 8 (target proyek).
      - name: Restore
        run: |
          dotnet restore windows/DynamicIsland.App/DynamicIsland.App.csproj
          dotnet restore windows/DynamicIsland.Core.Tests/DynamicIsland.Core.Tests.csproj

      # CI=true membuat peringatan analisis menjadi galat (Directory.Build.props).
      - name: Build
        run: |
          dotnet build windows/DynamicIsland.App/DynamicIsland.App.csproj -c Release --no-restore
          dotnet build windows/DynamicIsland.Core.Tests/DynamicIsland.Core.Tests.csproj -c Release --no-restore

      - name: Test
        run: >
          dotnet test windows/DynamicIsland.Core.Tests/DynamicIsland.Core.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Publish application
        run: >
          dotnet publish windows/DynamicIsland.App/DynamicIsland.App.csproj
          -c Release -r win-x64 --self-contained false
          -o artifacts/app

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-win-x64
          path: artifacts/app
